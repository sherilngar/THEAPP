<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="SO/ Al Marjan Island AI Concierge: a live proposal demo of a guest concierge that understands free text in any language, routes requests to the right department and keeps guests updated." />
    <meta name="theme-color" content="#F6F2EC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141311" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231C1A17'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23C9A774'/%3E%3C/svg%3E" />
    <link rel="manifest" href="manifest.webmanifest" />
    <title>SO/ AI Concierge · Proposal demo</title>
    <script>
      try {
        var t = localStorage.getItem('so-theme');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.dataset.theme = 'dark';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>This demo needs JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
